name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Cache face models
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\FaceGate\models
          key: facegate-models-${{ hashFiles('src/facegate/models.py') }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test
        env:
          FACEGATE_DOWNLOAD_MODELS: "1"
        run: python -m pytest -v
      - name: CLI smoke test
        run: |
          facegate --version
          facegate config
          facegate models
